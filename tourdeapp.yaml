exposedPort: 80
containers:
  - name: web
    image: registry.tourde.cloud/popletove/web
    port: 3001
    env:
      PORT: "3001"
      VITE_API_URL: "/api"
  - name: server
    image: registry.tourde.cloud/popletove/server
    port: 8080
    env:
      PORT: "8080"
      PRODUCT_DB_HOST: 127.0.0.1
      PRODUCT_DB_NAME: product
      PRODUCT_DB_PORT: "3306"
      SPRING_DATASOURCE_PASSWORD: "strongPassword?"
      SPRING_DATASOURCE_USERNAME: tda_user
  - name: mysql
    image: mysql
    tag: "8.4"
    env:
      MYSQL_DATABASE: product
      MYSQL_ROOT_PASSWORD: password
    port: 3306
  - name: caddy
    image: registry.tourde.cloud/popletove/caddy
    port: 80
build:
  - name: web
    context: ./frontend
    dockerfile: ./frontend/Dockerfile
    args:
      VITE_API_URL: "/api"
  - name: server
    context: ./backendgit add .
    dockerfile: ./backend/docker/Dockerfile
  - name: caddy
    context: ./caddy
    dockerfile: ./caddy/Dockerfile
